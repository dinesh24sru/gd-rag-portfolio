AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: GD RAG Cognito auth, HTTP API, documents storage, and SQS ingestion worker.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Architectures:
      - x86_64

Parameters:
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito Hosted UI domain prefix (letters, numbers, hyphens).
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    ConstraintDescription: Lowercase alphanumeric with optional hyphens; 1-63 chars.

  GoogleClientId:
    Type: String
    Description: Google OAuth 2.0 Web Client ID.
    NoEcho: true

  GoogleClientSecret:
    Type: String
    Description: Google OAuth 2.0 Web Client Secret.
    NoEcho: true

  CallbackUrls:
    Type: CommaDelimitedList
    Default: http://localhost:3000/auth/callback
    Description: Allowed OAuth callback URLs for the web app (comma-separated).

  LogoutUrls:
    Type: CommaDelimitedList
    Default: http://localhost:3000/login
    Description: Allowed logout redirect URLs (comma-separated).

  CorsAllowOrigin:
    Type: CommaDelimitedList
    Default: http://localhost:3000
    Description: Allowed CORS origins for the HTTP API and S3 uploads (comma-separated).

  QdrantUrl:
    Type: String
    Default: ""
    Description: Qdrant Cloud REST URL (https://....). Required for ingestion indexing.

  QdrantApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Qdrant Cloud API key. Required for ingestion indexing.

  QdrantCollectionName:
    Type: String
    Default: gd-rag-chunks
    Description: Qdrant collection name for document chunks.

  BedrockEmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Bedrock embedding model ID (smallest suitable Titan embed).

  EmbeddingDimensions:
    Type: Number
    Default: 256
    MinValue: 256
    MaxValue: 1024
    Description: Titan embed output dimensions (keep small for cost).

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: false
          Mutable: true
        - Name: picture
          Required: false
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      UserPoolAddOns:
        AdvancedSecurityMode: "OFF"
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        name: name
        picture: picture
        username: sub

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - GoogleIdentityProvider
    Properties:
      ClientName: !Sub "${AWS::StackName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - Google
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      ReadAttributes:
        - email
        - name
        - picture
        - email_verified
      WriteAttributes:
        - email
        - name
        - picture

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  IngestionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  IngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 90 # > worker timeout
      MessageRetentionPeriod: 345600 # 4 days
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestionDLQ.Arn
        maxReceiveCount: 3

  # SourceArn uses stack-name prefix (not !GetAtt DocumentsBucket) to avoid
  # Bucket ↔ QueuePolicy circular dependency when the bucket also notifies this queue.
  IngestionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref IngestionQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3ObjectCreated
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt IngestionQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-*"

  DocumentsBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - IngestionQueuePolicy
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref CorsAllowOrigin
            AllowedMethods:
              - PUT
              - HEAD
              - GET
            AllowedHeaders:
              - Content-Type
              - Content-Length
              - x-amz-content-sha256
              - x-amz-date
              - x-amz-security-token
              - x-amz-user-agent
              - Authorization
            ExposedHeaders:
              - ETag
              - x-amz-request-id
              - x-amz-id-2
            MaxAge: 3000
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt IngestionQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: tenant/
                  - Name: suffix
                    Value: /original

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenantId
          AttributeType: S
        - AttributeName: documentId
          AttributeType: S
      KeySchema:
        - AttributeName: tenantId
          KeyType: HASH
        - AttributeName: documentId
          KeyType: RANGE

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: !Ref CorsAllowOrigin
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: ../services/api/dist/
      Handler: handler.handler
      Description: GD RAG HTTP API (auth + document upload)
      Environment:
        Variables:
          DOCUMENTS_TABLE_NAME: !Ref DocumentsTable
          DOCUMENTS_BUCKET_NAME: !Ref DocumentsBucket
          QDRANT_URL: !Ref QdrantUrl
          QDRANT_API_KEY: !Ref QdrantApiKey
          QDRANT_COLLECTION: !Ref QdrantCollectionName
          EMBEDDING_DIMENSIONS: !Sub "${EmbeddingDimensions}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
        - S3CrudPolicy:
            BucketName: !Ref DocumentsBucket
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
        CreateUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/upload-url
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
        ListDocuments:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
        GetDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/{documentId}
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
        DeleteDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/{documentId}
            Method: DELETE
            Auth:
              Authorizer: CognitoJwtAuthorizer

  IngestionWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ingestion"
      RetentionInDays: 14

  IngestionWorkerFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - IngestionWorkerLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ingestion"
      CodeUri: ../services/ingestion-worker/dist/
      Handler: handler.handler
      Description: SQS document ingestion worker (extract → chunk → embed → index)
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          DOCUMENTS_TABLE_NAME: !Ref DocumentsTable
          DOCUMENTS_BUCKET_NAME: !Ref DocumentsBucket
          QDRANT_URL: !Ref QdrantUrl
          QDRANT_API_KEY: !Ref QdrantApiKey
          QDRANT_COLLECTION: !Ref QdrantCollectionName
          BEDROCK_EMBEDDING_MODEL_ID: !Ref BedrockEmbeddingModelId
          EMBEDDING_DIMENSIONS: !Sub "${EmbeddingDimensions}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
        - S3ReadPolicy:
            BucketName: !Ref DocumentsBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockEmbeddingModelId}"
      Events:
        IngestionQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt IngestionQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt UserPool.Arn

  UserPoolClientId:
    Description: Cognito App Client ID for the Next.js web app
    Value: !Ref UserPoolClient

  CognitoDomainPrefixOut:
    Description: Cognito Hosted UI domain prefix
    Value: !Ref CognitoDomainPrefix

  CognitoHostedUiDomain:
    Description: Full Cognito Hosted UI domain host (no scheme)
    Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"

  CognitoIssuerUrl:
    Description: OIDC issuer URL for JWT verification
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  GoogleIdpRedirectUri:
    Description: Authorized redirect URI to add in Google Cloud OAuth client
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"

  ApiBaseUrl:
    Description: HTTP API base URL (no trailing slash)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  DocumentsBucketName:
    Description: Private S3 bucket for original tenant documents
    Value: !Ref DocumentsBucket

  DocumentsTableName:
    Description: DynamoDB table for document metadata
    Value: !Ref DocumentsTable

  IngestionQueueUrl:
    Description: SQS URL for document ingestion
    Value: !Ref IngestionQueue

  IngestionDLQUrl:
    Description: SQS DLQ URL for failed ingestion messages
    Value: !Ref IngestionDLQ

  Region:
    Description: AWS region of this stack
    Value: !Ref AWS::Region
